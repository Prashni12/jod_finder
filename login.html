<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login | AI Job Finder</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/animate.css/4.1.1/animate.min.css" />

    <style>
        :root {
            --primary: #6366f1;
            --secondary: #9333ea;
            --dark-surface: #0f172a;
            --bg-body: #f1f5f9;
        }

        body {
            font-family: 'Plus Jakarta Sans', sans-serif;
            background-color: var(--bg-body);
            background-image: 
                radial-gradient(at 0% 0%, rgba(99, 102, 241, 0.12) 0, transparent 50%), 
                radial-gradient(at 100% 100%, rgba(147, 51, 234, 0.12) 0, transparent 50%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        /* Login Card - Glassmorphism */
        .login-card {
            background: rgba(255, 255, 255, 0.85);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.5);
            border-radius: 30px;
            padding: 50px;
            width: 100%;
            max-width: 480px;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.1);
        }

        .brand-logo {
            font-size: 28px;
            font-weight: 800;
            background: linear-gradient(135deg, var(--primary), var(--secondary));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            letter-spacing: -1px;
            margin-bottom: 5px;
        }

        .login-title {
            font-weight: 700;
            font-size: 26px;
            color: var(--dark-surface);
        }

        .login-sub {
            color: #64748b;
            margin-bottom: 35px;
            font-size: 0.95rem;
        }

        /* Form Controls */
        .form-label {
            font-weight: 600;
            font-size: 0.85rem;
            color: #475569;
            margin-bottom: 8px;
        }

        .input-group-text {
            background: #f8fafc;
            border-color: #e2e8f0;
            color: #94a3b8;
            border-radius: 14px 0 0 14px;
            padding-left: 18px;
            padding-right: 18px;
        }

        .form-control {
            border-radius: 14px;
            padding: 14px 18px;
            border: 1px solid #e2e8f0;
            font-size: 0.95rem;
            transition: all 0.3s ease;
        }

        .form-control:focus {
            border-color: var(--primary);
            box-shadow: 0 0 0 4px rgba(99, 102, 241, 0.1);
            background: white;
        }

        .password-toggle {
            cursor: pointer;
            border-radius: 0 14px 14px 0 !important;
            background: #f8fafc;
            border-left: none;
            color: #94a3b8;
        }

        /* Primary Button */
        .btn-login {
            background: linear-gradient(135deg, var(--primary), var(--secondary));
            border: none;
            border-radius: 16px;
            padding: 16px;
            font-weight: 700;
            color: white;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            margin-top: 10px;
            box-shadow: 0 10px 15px -3px rgba(99, 102, 241, 0.3);
        }

        .btn-login:hover {
            transform: translateY(-2px);
            box-shadow: 0 20px 25px -5px rgba(99, 102, 241, 0.4);
            opacity: 0.95;
            color: white;
        }

        /* Footer & Home Link */
        .home-link {
            position: fixed;
            top: 30px;
            right: 40px;
            text-decoration: none;
            color: var(--primary);
            font-weight: 700;
            font-size: 0.9rem;
            display: flex;
            align-items: center;
            gap: 8px;
            transition: 0.3s;
        }

        .home-link:hover {
            color: var(--secondary);
            transform: translateX(-5px);
        }

        .auth-link {
            color: var(--primary);
            text-decoration: none;
            font-weight: 700;
        }

        .footer-text {
            color: #64748b;
            margin-top: 30px;
            font-size: 0.9rem;
        }

        .error-box {
            background: #fff1f2;
            color: #e11d48;
            padding: 14px;
            border-radius: 14px;
            margin-bottom: 25px;
            font-size: 0.85rem;
            font-weight: 500;
            border: 1px solid #ffe4e6;
        }
    </style>
</head>

<body>

    <a href="{{ url_for('home') }}" class="home-link">
        <i class="fas fa-arrow-left"></i> Back to Home
    </a>

    <div class="login-card animate__animated animate__fadeInUp">
        <div class="text-center">
            <div class="brand-logo">
                <i class="fas fa-bolt-lightning me-1"></i> Job Finder
            </div>
            <h2 class="login-title">Welcome Back</h2>
            <p class="login-sub">Sign in to your dashboard</p>
        </div>

        {% with messages = get_flashed_messages() %}
        {% if messages %}
        <div class="error-box animate__animated animate__shakeX">
            <i class="fas fa-circle-exclamation me-2"></i>
            {% for message in messages %}
                {{ message }}
            {% endfor %}
        </div>
        {% endif %}
        {% endwith %}

        <form method="POST">
            <div class="mb-3">
                <label class="form-label">Username</label>
                <div class="input-group">
                    <span class="input-group-text"><i class="fas fa-user-ninja"></i></span>
                    <input type="text" class="form-control" name="username" placeholder="Enter username" required>
                </div>
            </div>

            <div class="mb-4">
                <label class="form-label">Password</label>
                <div class="input-group">
                    <span class="input-group-text"><i class="fas fa-key"></i></span>
                    <input type="password" class="form-control" name="password" id="loginPassword" placeholder="Enter password" required>
                    <span class="input-group-text password-toggle" onclick="toggleVisibility('loginPassword', this)">
                        <i class="fas fa-eye"></i>
                    </span>
                </div>
            </div>

            <button type="submit" class="btn btn-login w-100">
                Sign In <i class="fas fa-arrow-right ms-2"></i>
            </button>
        </form>

        <div class="text-center footer-text">
            New here? <a href="{{ url_for('signup') }}" class="auth-link">Create an account</a>
        </div>
    </div>

    <script>
        // Password Visibility Toggle
        function toggleVisibility(id, el) {
            const input = document.getElementById(id);
            const icon = el.querySelector('i');
            if (input.type === 'password') {
                input.type = 'text';
                icon.classList.replace('fa-eye', 'fa-eye-slash');
            } else {
                input.type = 'password';
                icon.classList.replace('fa-eye-slash', 'fa-eye');
            }
        }
    </script>
</body>
</html>
