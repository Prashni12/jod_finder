

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Create Account | AI Job Finder</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/animate.css/4.1.1/animate.min.css" />

    <style>
        :root {
            --primary: #6366f1;
            --secondary: #9333ea;
            --dark-surface: #0f172a;
            --bg-body: #f1f5f9;
        }

        body {
            font-family: 'Plus Jakarta Sans', sans-serif;
            background-color: var(--bg-body);
            background-image: 
                radial-gradient(at 0% 0%, rgba(99, 102, 241, 0.1) 0, transparent 50%), 
                radial-gradient(at 100% 100%, rgba(147, 51, 234, 0.1) 0, transparent 50%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        /* Signup Card */
        .signup-card {
            background: rgba(255, 255, 255, 0.9);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.4);
            border-radius: 28px;
            padding: 50px;
            width: 100%;
            max-width: 500px;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.08);
        }

        /* Brand Styling */
        .portal-logo {
            font-size: 28px;
            font-weight: 800;
            background: linear-gradient(135deg, var(--primary), var(--secondary));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            letter-spacing: -1px;
        }

        .signup-title {
            font-weight: 700;
            font-size: 26px;
            color: var(--dark-surface);
            margin-top: 10px;
        }

        .subtitle {
            color: #64748b;
            font-size: 0.95rem;
            margin-bottom: 35px;
        }

        /* Form Controls */
        .form-label {
            font-weight: 600;
            font-size: 0.85rem;
            color: #475569;
            margin-bottom: 8px;
        }

        .input-group-text {
            background: #f8fafc;
            border-color: #e2e8f0;
            color: #94a3b8;
            border-radius: 12px 0 0 12px;
        }

        .form-control {
            border-radius: 12px;
            padding: 12px 16px;
            border: 1px solid #e2e8f0;
            font-size: 0.95rem;
            transition: 0.3s;
        }

        .form-control:focus {
            border-color: var(--primary);
            box-shadow: 0 0 0 4px rgba(99, 102, 241, 0.1);
        }

        .password-toggle {
            cursor: pointer;
            border-radius: 0 12px 12px 0 !important;
            background: #f8fafc;
            border-left: none;
        }

        /* Button */
        .btn-signup {
            background: linear-gradient(135deg, var(--primary), var(--secondary));
            border: none;
            border-radius: 14px;
            padding: 14px;
            font-weight: 700;
            color: white;
            transition: 0.3s;
            margin-top: 10px;
            box-shadow: 0 10px 15px -3px rgba(99, 102, 241, 0.3);
        }

        .btn-signup:hover {
            transform: translateY(-2px);
            box-shadow: 0 20px 25px -5px rgba(99, 102, 241, 0.4);
            opacity: 0.95;
            color: white;
        }

        /* Footer Links */
        .auth-link {
            color: var(--primary);
            text-decoration: none;
            font-weight: 700;
        }

        .auth-link:hover {
            color: var(--secondary);
            text-decoration: underline;
        }

        .footer-text {
            color: #64748b;
            margin-top: 25px;
            font-size: 0.9rem;
        }

        
        .alert {
            border-radius: 14px;
            font-size: 0.9rem;
            font-weight: 500;
        }
    </style>
</head>

<body>

<div class="signup-card animate__animated animate__zoomIn">

    <div class="text-center">
        <div class="portal-logo">
            <i class="fas fa-bolt-lightning me-1"></i> Job Finder
        </div>
        <h2 class="signup-title">Join the Future</h2>
        <p class="subtitle">Your career paths start here.</p>
    </div>

    {% with messages = get_flashed_messages(with_categories=true) %}
    {% if messages %}
    {% for category, message in messages %}
    <div class="alert alert-{{ 'danger' if category == 'error' else 'success' }} border-0 animate__animated animate__shakeX">
        <i class="fas {{ 'fa-circle-exclamation' if category == 'error' else 'fa-circle-check' }} me-2"></i>
        {{ message }}
    </div>
    {% endfor %}
    {% endif %}
    {% endwith %}

    <form method="POST" id="signupForm">
        <div class="mb-3">
            <label class="form-label">Username</label>
            <div class="input-group">
                <span class="input-group-text"><i class="fas fa-user"></i></span>
                <input type="text" class="form-control" name="username" placeholder="Choose username" required>
            </div>
        </div>

        <div class="mb-3">
            <label class="form-label">Password</label>
            <div class="input-group">
                <span class="input-group-text"><i class="fas fa-lock"></i></span>
                <input type="password" class="form-control" name="password" id="password" placeholder="Min. 6 chars & 1 number" required 
                       pattern="((?=.*[a-z])(?=.*[0-9]).{6,})">
                <span class="input-group-text password-toggle" onclick="togglePass('password', this)">
                    <i class="fas fa-eye"></i>
                </span>
            </div>
        </div>

        <div class="mb-4">
            <label class="form-label">Confirm Password</label>
            <div class="input-group">
                <span class="input-group-text"><i class="fas fa-shield-check"></i></span>
                <input type="password" class="form-control" name="confirm_password" id="confirm_password" placeholder="Repeat password" required>
                <span class="input-group-text password-toggle" onclick="togglePass('confirm_password', this)">
                    <i class="fas fa-eye"></i>
                </span>
            </div>
        </div>

        <button type="submit" class="btn btn-signup w-100">
            <i class="fas fa-user-plus me-2"></i> Create Account
        </button>
    </form>

    <div class="text-center footer-text">
        Already a member? <a href="{{ url_for('login') }}" class="auth-link">Sign in</a>
        <div class="mt-3">
            <a href="{{ url_for('home') }}" class="text-muted text-decoration-none small">
                <i class="fas fa-arrow-left me-1"></i> Back to Home
            </a>
        </div>
    </div>
</div>

<script>
    // Toggle Password Visibility
    function togglePass(id, el) {
        const input = document.getElementById(id);
        const icon = el.querySelector('i');
        if (input.type === 'password') {
            input.type = 'text';
            icon.classList.replace('fa-eye', 'fa-eye-slash');
        } else {
            input.type = 'password';
            icon.classList.replace('fa-eye-slash', 'fa-eye');
        }
    }

    // Passwords Match Validation
    document.getElementById("signupForm").addEventListener("submit", function(e) {
        let p = document.getElementById("password").value;
        let cp = document.getElementById("confirm_password").value;

        if (p !== cp) {
            e.preventDefault();
            alert("Passwords do not match!");
        }
    });
</script>

</body>
</html>
